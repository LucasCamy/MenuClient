server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Aplicação SPA: URLs futuras devem voltar para o React.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Arquivos gerados pelo Vite recebem cache longo e imutável.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
